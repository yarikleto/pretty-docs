<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#252850"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5"/>
      <stop offset="100%" stop-color="#748ffc"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37b24d"/>
      <stop offset="100%" stop-color="#51cf66"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59f00"/>
      <stop offset="100%" stop-color="#fcc419"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedRect">
      <rect width="960" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedRect)">
    <!-- Background -->
    <rect width="960" height="320" fill="url(#bg)"/>

    <!-- Subtle grid pattern -->
    <g opacity="0.04" stroke="#748ffc" stroke-width="1">
      <line x1="0" y1="40" x2="960" y2="40"/>
      <line x1="0" y1="80" x2="960" y2="80"/>
      <line x1="0" y1="120" x2="960" y2="120"/>
      <line x1="0" y1="160" x2="960" y2="160"/>
      <line x1="0" y1="200" x2="960" y2="200"/>
      <line x1="0" y1="240" x2="960" y2="240"/>
      <line x1="0" y1="280" x2="960" y2="280"/>
      <line x1="80" y1="0" x2="80" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="320"/>
      <line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="320" y1="0" x2="320" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="480" y1="0" x2="480" y2="320"/>
      <line x1="560" y1="0" x2="560" y2="320"/>
      <line x1="640" y1="0" x2="640" y2="320"/>
      <line x1="720" y1="0" x2="720" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="880" y1="0" x2="880" y2="320"/>
    </g>

    <!-- Decorative blurred circles -->
    <circle cx="120" cy="260" r="120" fill="#4c6ef5" opacity="0.06"/>
    <circle cx="840" cy="60" r="100" fill="#748ffc" opacity="0.06"/>
    <circle cx="700" cy="280" r="80" fill="#37b24d" opacity="0.04"/>

    <!-- "Before" card (messy text) -->
    <g transform="translate(80, 72)">
      <rect width="240" height="176" rx="12" fill="#13141f" stroke="#2e3150" stroke-width="1"/>
      <!-- Card header dots -->
      <circle cx="20" cy="16" r="4" fill="#ff6b6b" opacity="0.7"/>
      <circle cx="32" cy="16" r="4" fill="#fcc419" opacity="0.7"/>
      <circle cx="44" cy="16" r="4" fill="#51cf66" opacity="0.7"/>
      <line x1="0" y1="32" x2="240" y2="32" stroke="#2e3150" stroke-width="1"/>
      <!-- Messy monospace lines -->
      <g opacity="0.35">
        <rect x="16" y="44" width="145" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="58" width="120" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="72" width="200" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="86" width="85" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="100" width="170" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="114" width="130" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="128" width="190" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="142" width="100" height="6" rx="2" fill="#868e96"/>
        <rect x="16" y="156" width="155" height="6" rx="2" fill="#868e96"/>
      </g>
      <!-- Label -->
      <text x="120" y="-10" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#868e96" letter-spacing="0.08em" text-transform="uppercase">RFC SPEC</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(352, 145)">
      <line x1="0" y1="15" x2="48" y2="15" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
      <polygon points="52,15 44,10 44,20" fill="#4c6ef5" opacity="0.6"/>
    </g>

    <!-- "After" card (pretty doc) -->
    <g transform="translate(432, 72)">
      <rect width="240" height="176" rx="12" fill="#1c1d32" stroke="#4c6ef5" stroke-width="1" opacity="0.95"/>
      <!-- Card header -->
      <circle cx="20" cy="16" r="4" fill="#4c6ef5" opacity="0.8"/>
      <circle cx="32" cy="16" r="4" fill="#4c6ef5" opacity="0.4"/>
      <circle cx="44" cy="16" r="4" fill="#4c6ef5" opacity="0.2"/>
      <line x1="0" y1="32" x2="240" y2="32" stroke="#2e3150" stroke-width="1"/>
      <!-- Pretty structured content -->
      <!-- Title -->
      <rect x="16" y="44" width="120" height="8" rx="3" fill="#e4e6f0" opacity="0.9"/>
      <!-- Subtitle -->
      <rect x="16" y="60" width="180" height="5" rx="2" fill="#748ffc" opacity="0.4"/>
      <!-- Divider -->
      <line x1="16" y1="74" x2="224" y2="74" stroke="#2e3150" stroke-width="1"/>
      <!-- Content with colored accents -->
      <rect x="16" y="84" width="160" height="5" rx="2" fill="#c8cad8" opacity="0.5"/>
      <rect x="16" y="96" width="200" height="5" rx="2" fill="#c8cad8" opacity="0.5"/>
      <!-- Citation badge -->
      <rect x="16" y="110" width="60" height="14" rx="4" fill="#4c6ef5" opacity="0.15"/>
      <rect x="22" y="115" width="48" height="4" rx="1" fill="#748ffc" opacity="0.6"/>
      <!-- Data type pills -->
      <g transform="translate(16, 134)">
        <rect width="24" height="20" rx="6" fill="#37b24d" opacity="0.15"/>
        <text x="12" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#51cf66">A</text>
      </g>
      <g transform="translate(46, 134)">
        <rect width="24" height="20" rx="6" fill="#4c6ef5" opacity="0.15"/>
        <text x="12" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#748ffc">I</text>
      </g>
      <g transform="translate(76, 134)">
        <rect width="24" height="20" rx="6" fill="#f59f00" opacity="0.15"/>
        <text x="12" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#fcc419">E</text>
      </g>
      <!-- Bottom text lines -->
      <rect x="16" y="162" width="140" height="4" rx="1.5" fill="#c8cad8" opacity="0.3"/>
    </g>

    <!-- Title text -->
    <g transform="translate(728, 120)">
      <!-- Logo icon -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#accent)"/>
      <path d="M10 12h16M10 18h12M10 24h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <!-- Title -->
      <text x="46" y="14" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#e4e6f0" letter-spacing="-0.02em">Pretty</text>
      <text x="46" y="34" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#e4e6f0" letter-spacing="-0.02em">Docs</text>
    </g>

    <!-- Tagline -->
    <text x="728" y="184" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#868e96" letter-spacing="0.01em">Specs rewritten for humans.</text>
    <text x="728" y="202" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#868e96" letter-spacing="0.01em">Every claim sourced.</text>

    <!-- Badges -->
    <g transform="translate(728, 224)">
      <rect width="52" height="20" rx="10" fill="#4c6ef5" opacity="0.12"/>
      <text x="26" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#748ffc">Astro</text>
      <rect x="58" width="40" height="20" rx="10" fill="#37b24d" opacity="0.12"/>
      <text x="78" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#51cf66">MDX</text>
      <rect x="104" width="42" height="20" rx="10" fill="#f59f00" opacity="0.12"/>
      <text x="125" y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#fcc419">SVG</text>
    </g>
  </g>
</svg>
